{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla del Evento</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-black h-screen w-screen overflow-hidden flex flex-col items-center justify-center cursor-none relative">

    <div id="empty-state" class="text-slate-500 text-xl font-light absolute flex flex-col items-center">
        <svg class="w-16 h-16 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
        </svg>
        <p>Esperando las primeras fotos...</p>
        <p class="text-sm mt-2">Escaneá el QR para participar</p>
    </div>

    <img id="photo-display" src="" alt="Carrusel"
         class="max-h-full max-w-full object-contain transition-opacity duration-1000 opacity-0 z-10">

    <script>
        let photos = [];
        let currentIndex = 0;
        const display = document.getElementById('photo-display');
        const emptyState = document.getElementById('empty-state');

        // Función para ir a buscar las fotos al backend
        async function fetchPhotos() {
            try {
                const response = await fetch('/api/photos/');
                const data = await response.json();

                if (data.photos.length > 0) {
                    photos = data.photos;
                    emptyState.style.display = 'none'; // Ocultamos el mensaje inicial
                }
            } catch (error) {
                console.error("Error al obtener las fotos:", error);
            }
        }

        // Función para cambiar la imagen visible
        function rotatePhotos() {
            if (photos.length === 0) return;

            // 1. Desvanecer la foto actual
            display.classList.remove('opacity-100');
            display.classList.add('opacity-0');

            // 2. Esperar a que termine el fade out, cambiar origen y hacer fade in
            setTimeout(() => {
                display.src = photos[currentIndex].url;

                // Mostrar la nueva foto
                display.classList.remove('opacity-0');
                display.classList.add('opacity-100');

                // Avanzar al siguiente índice (o volver a 0 si llegamos al final)
                currentIndex = (currentIndex + 1) % photos.length;
            }, 1000); // Coincide con el 'duration-1000' de Tailwind
        }

        // Ejecución inicial
        fetchPhotos().then(() => {
            rotatePhotos();
        });

        // Configurar los intervalos automáticos
        setInterval(fetchPhotos, 10000); // Busca fotos nuevas cada 10 segundos
        setInterval(rotatePhotos, 6000); // Cambia la foto cada 6 segundos
    </script>
</body>
</html>
