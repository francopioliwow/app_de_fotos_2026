{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla en Vivo - {{ event_name }}</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-black h-screen w-screen overflow-hidden flex flex-col items-center justify-center cursor-none relative font-sans selection:bg-pink-500 selection:text-white">

    <div class="absolute top-8 left-1/2 transform -translate-x-1/2 z-30 bg-white/5 border border-white/10 backdrop-blur-xl px-12 py-5 rounded-full shadow-2xl">
        <h2 class="text-3xl md:text-4xl font-black uppercase tracking-[0.2em] bg-gradient-to-r from-pink-500 via-fuchsia-500 to-orange-400 bg-clip-text text-transparent drop-shadow-lg leading-none">
            {{ event_name }}
        </h2>
    </div>

    <div id="empty-state" class="text-white/80 text-2xl font-light absolute flex flex-col items-center z-20">
        <div class="w-24 h-24 mb-6 rounded-full bg-white/5 border border-white/10 flex items-center justify-center animate-pulse shadow-[0_0_50px_rgba(236,72,153,0.2)]">
            <svg class="w-12 h-12 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
        </div>
        <p class="tracking-widest text-slate-300 font-medium uppercase text-lg">Escaneá el QR y compartí tu foto</p>
    </div>

    <img id="photo-display" src="" alt="Carrusel"
         class="max-h-full max-w-full object-contain transition-opacity duration-1000 opacity-0 z-10">

    <div id="guest-card" class="absolute bottom-10 left-10 z-30 bg-black/40 border border-white/20 backdrop-blur-2xl pl-4 pr-10 py-4 rounded-full shadow-[0_10px_40px_rgba(0,0,0,0.8)] flex items-center gap-5 transition-all duration-700 opacity-0 transform translate-y-8">

        <div class="w-16 h-16 bg-gradient-to-br from-pink-500 via-fuchsia-500 to-orange-400 rounded-full flex items-center justify-center border-2 border-white/30 shadow-lg shrink-0">
            <span class="font-black text-white text-3xl shadow-sm leading-none pt-1" id="guest-avatar">I</span>
        </div>

        <div class="flex flex-col justify-center">
            <div class="flex items-center gap-2 mb-1">
                <svg class="w-4 h-4 text-pink-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
                <p class="text-white/70 text-xs font-bold uppercase tracking-widest">
                    Mesa <span id="guest-table" class="text-orange-400 font-black text-sm ml-1">0</span>
                </p>
            </div>
            <h3 class="text-white font-black text-3xl md:text-4xl tracking-tight drop-shadow-md leading-none" id="guest-name">
                Nombre Invitado
            </h3>
        </div>
    </div>

    <div class="absolute bottom-8 right-8 z-30 text-right opacity-50 hover:opacity-100 transition-opacity duration-300">
        <p class="text-[10px] uppercase font-bold tracking-[0.2em] text-white/50 mb-1">Servicio provisto por</p>
        <h4 class="text-sm font-black text-white tracking-wide leading-none">Franco Pioli</h4>
        <p class="text-xs font-bold bg-gradient-to-r from-pink-400 to-orange-400 bg-clip-text text-transparent mt-0.5">Creativo Soluciones Tecnológicas</p>
    </div>

    <script>
        let photos = [];
        let currentIndex = 0;
        const display = document.getElementById('photo-display');
        const emptyState = document.getElementById('empty-state');
        const guestCard = document.getElementById('guest-card');
        const guestName = document.getElementById('guest-name');
        const guestTable = document.getElementById('guest-table');
        const guestAvatar = document.getElementById('guest-avatar');

        async function fetchPhotos() {
            try {
                const response = await fetch("{% url 'api_photos' %}");
                const data = await response.json();
                if (data.photos.length > 0) {
                    photos = data.photos;
                    emptyState.style.display = 'none';
                }
            } catch (error) {
                console.error("Error cargando fotos:", error);
            }
        }

        function rotatePhotos() {
            if (photos.length === 0) return;

            // Transición de salida suave (se mueve hacia abajo y desaparece)
            display.classList.remove('opacity-100');
            display.classList.add('opacity-0');
            guestCard.classList.remove('opacity-100', 'translate-y-0');
            guestCard.classList.add('opacity-0', 'translate-y-8');

            setTimeout(() => {
                const currentPhoto = photos[currentIndex];

                // Actualizamos imagen
                display.src = currentPhoto.url;
                display.classList.remove('opacity-0');
                display.classList.add('opacity-100');

                // Actualizamos datos
                guestName.textContent = currentPhoto.guest_name;
                // Ahora solo inyectamos el número, la palabra "Mesa" ya está en el HTML
                guestTable.textContent = currentPhoto.table_number;
                guestAvatar.textContent = currentPhoto.guest_name.charAt(0).toUpperCase();

                // Transición de entrada suave
                guestCard.classList.remove('opacity-0', 'translate-y-8');
                guestCard.classList.add('opacity-100', 'translate-y-0');

                currentIndex = (currentIndex + 1) % photos.length;
            }, 1000); // 1 segundo de fundido a negro/vacío entre fotos
        }

        // Inicialización
        fetchPhotos().then(() => { rotatePhotos(); });

        // Polling de nuevas fotos cada 10 seg
        setInterval(fetchPhotos, 10000);

        // Rotación cada 8 segundos (1s transición + 7s de lectura)
        setInterval(rotatePhotos, 8000);
    </script>
</body>
</html>
